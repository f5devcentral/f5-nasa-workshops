# Read the Docs configuration file for f5-nasa-workshops
version: 2
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    post_install:
      - pip install --upgrade --force-reinstall pip==24.3.1 setuptools==80.9.0 wheel
      - pip install -r docs/requirements.txt
sphinx:
  configuration: docs/conf.py
  fail_on_warning: false
formats: []
