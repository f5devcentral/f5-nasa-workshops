# Read the Docs configuration file for f5-nasa-workshops
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  commands:
    - asdf global python 3.11.12
    - python -m venv "$READTHEDOCS_VIRTUALENV_PATH"
    - "$READTHEDOCS_VIRTUALENV_PATH/bin/pip" install --upgrade "pip<25" "setuptools<81" wheel
    - "$READTHEDOCS_VIRTUALENV_PATH/bin/pip" install -r docs/requirements.txt
    - "$READTHEDOCS_VIRTUALENV_PATH/bin/python" -m sphinx -b html -d docs/_build/doctrees docs "$READTHEDOCS_OUTPUT/html"

formats: []
